<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&amp;display=swap');
      .bg { fill: #0a0e17; }
      .binary { font-family: 'JetBrains Mono', 'Courier New', monospace; font-size: 14px; fill: #1a2332; }
      .terminal-bg { fill: #0d1117; stroke: #1e2d3d; stroke-width: 1; rx: 8; }
      .terminal-bar { fill: #161b22; rx: 8; }
      .dot-red { fill: #ff5f57; }
      .dot-yellow { fill: #febc2e; }
      .dot-green { fill: #28c840; }
      .terminal-title { font-family: 'JetBrains Mono', 'Courier New', monospace; font-size: 13px; fill: #8b949e; }
      .terminal-line { fill: #1e2d3d; }
      .prompt { font-family: 'JetBrains Mono', 'Courier New', monospace; font-size: 15px; fill: #00d4ff; }
      .command { font-family: 'JetBrains Mono', 'Courier New', monospace; font-size: 15px; fill: #c9d1d9; }
      .progress-bg { fill: #1e2d3d; rx: 3; }
      .progress-fill { fill: #00d4ff; rx: 3; }
      .progress-text { font-family: 'JetBrains Mono', 'Courier New', monospace; font-size: 13px; fill: #00d4ff; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="900" height="400" class="bg"/>

  <!-- Binary rain columns -->
  <text class="binary" x="30" y="30">0  1  0  1  0</text>
  <text class="binary" x="30" y="55">1  0  0  1  1</text>
  <text class="binary" x="30" y="80">0  0  1  0  1</text>
  <text class="binary" x="30" y="105">1  0  1  0  1</text>
  <text class="binary" x="30" y="130">0  1  1  1  1</text>
  <text class="binary" x="30" y="155">1  1  0  0  0</text>
  <text class="binary" x="30" y="180">0  0  1  0  0</text>
  <text class="binary" x="30" y="205">1  0  1  0  0</text>
  <text class="binary" x="30" y="230">0  1  0  1  0</text>
  <text class="binary" x="30" y="255">1  1  1  1  1</text>
  <text class="binary" x="30" y="280">0  0  0  1  0</text>
  <text class="binary" x="30" y="305">1  0  1  0  1</text>
  <text class="binary" x="30" y="330">0  1  1  0  0</text>
  <text class="binary" x="30" y="355">1  1  0  1  0</text>
  <text class="binary" x="30" y="380">0  1  0  1  0</text>

  <!-- Right binary -->
  <text class="binary" x="760" y="30">1  0  1  1  0</text>
  <text class="binary" x="760" y="55">0  1  0  0  1</text>
  <text class="binary" x="760" y="80">1  1  0  1  1</text>
  <text class="binary" x="760" y="105">0  0  1  1  0</text>
  <text class="binary" x="760" y="130">1  0  1  0  1</text>
  <text class="binary" x="760" y="155">0  1  1  1  0</text>
  <text class="binary" x="760" y="180">1  0  0  1  1</text>
  <text class="binary" x="760" y="205">0  1  0  0  0</text>
  <text class="binary" x="760" y="230">1  1  1  0  1</text>
  <text class="binary" x="760" y="255">0  0  1  0  0</text>
  <text class="binary" x="760" y="280">1  0  1  1  0</text>
  <text class="binary" x="760" y="305">0  1  0  1  1</text>
  <text class="binary" x="760" y="330">1  0  0  0  1</text>
  <text class="binary" x="760" y="355">0  1  1  0  0</text>
  <text class="binary" x="760" y="380">1  0  1  0  1</text>

  <!-- Terminal window -->
  <rect x="160" y="35" width="580" height="330" class="terminal-bg"/>

  <!-- Title bar -->
  <rect x="160" y="35" width="580" height="35" class="terminal-bar"/>
  <circle cx="182" cy="52" r="6" class="dot-red"/>
  <circle cx="202" cy="52" r="6" class="dot-yellow"/>
  <circle cx="222" cy="52" r="6" class="dot-green"/>
  <text class="terminal-title" x="260" y="57">terminal@noblerworks:~</text>

  <!-- Divider line -->
  <rect x="175" y="75" width="550" height="1" class="terminal-line"/>

  <!-- Terminal content -->
  <text class="prompt" x="195" y="115">&gt; <tspan class="command">Connecting to Nobler Works...</tspan></text>
  <text class="prompt" x="195" y="155">&gt; <tspan class="command">Developing MVP architecture...</tspan></text>
  <text class="prompt" x="195" y="195">&gt; <tspan class="command">Designing systems for scale...</tspan></text>
  <text class="prompt" x="195" y="235">&gt; <tspan class="command">Deploying cloud infrastructure...</tspan></text>

  <!-- Progress bar -->
  <text class="progress-text" x="195" y="310">[</text>
  <rect x="210" y="297" width="460" height="16" class="progress-bg"/>
  <rect x="210" y="297" width="460" height="16" class="progress-fill" opacity="0.8"/>
  <text class="progress-text" x="678" y="310">] 100%</text>
</svg>
